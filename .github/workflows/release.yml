name: Release

# Publica o @blips/ui no npm via changesets.
# Fluxo (two-step):
#  1. PRs de feature incluem um changeset (`pnpm changeset`).
#  2. Ao mergear na `main`, este workflow abre/atualiza o PR "Version Packages".
#  3. Ao mergear o "Version Packages" PR, este workflow roda `pnpm release`
#     (build + `changeset publish`) e publica no npm + cria as tags.
on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # criar o branch/commit de versão e as tags
  pull-requests: write # abrir/atualizar o PR "Version Packages"
  id-token: write # provenance no npm publish

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets precisa do histórico completo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
