name: Release

# Publica o @blips/ui no npm via changesets, autenticando por
# Trusted Publishing (OIDC) — sem NPM_TOKEN de longa duração.
#
# Pré-requisitos (uma vez):
#  - Registrar o trusted publisher em npmjs.com → @blips/ui →
#    Settings → Trusted Publisher: organização=Blips-ativos, repositório=ui,
#    workflow=release.yml, ação=`npm publish`.
#  - Settings → Actions → General → permitir "Read and write" e
#    "Allow GitHub Actions to create and approve pull requests".
#
# Fluxo (two-step):
#  1. PRs de feature incluem um changeset (`pnpm changeset`).
#  2. Ao mergear na `main`, abre/atualiza o PR "Version Packages".
#  3. Ao mergear o "Version Packages" PR, roda `pnpm release`
#     (build + `changeset publish`) e publica no npm + cria as tags.
on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # criar o branch/commit de versão e as tags
  pull-requests: write # abrir/atualizar o PR "Version Packages"
  id-token: write # OIDC: necessário para o Trusted Publishing

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets precisa do histórico completo

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # >= 22.14.0, exigido pelo Trusted Publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # `changeset publish` chama o `npm publish` global, que detecta o
      # ambiente OIDC automaticamente. Exige npm >= 11.5.1.
      - name: Ensure npm supports OIDC
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem NPM_TOKEN: a autenticação do publish é via OIDC (id-token).
