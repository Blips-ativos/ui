name: Release

# Disparado quando um PR de release (título `release: vX.Y.Z`) é mergeado na
# main. A versão é extraída deterministicamente do título do PR. Em seguida:
#   1. cria a tag anotada vX.Y.Z + GitHub Release;
#   2. publica o @blips/ui no npm (Trusted Publishing / OIDC, sem token);
#   3. faz o build SSG do app docs e o deploy no Firebase Hosting.
#
# A versão publicada vem de packages/ui/package.json (bumpado pelo /release no
# PR), então deve coincidir com a versão do título.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write # criar/empurrar a tag e a release
  id-token: write # OIDC para o Trusted Publishing no npm

jobs:
  release:
    name: Release
    # Só roda em PR efetivamente mergeado e com o título na convenção.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'release: v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (merge commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Extrair versão do título do PR
        id: ver
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          VERSION="${TITLE#release: v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Título fora da convenção 'release: vX.Y.Z': $TITLE" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Conferir package.json == versão do título
        run: |
          PKG=$(node -p "require('./packages/ui/package.json').version")
          if [ "$PKG" != "${{ steps.ver.outputs.version }}" ]; then
            echo "packages/ui/package.json ($PKG) != título (${{ steps.ver.outputs.version }})" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24 # >= 22.14.0, exigido pelo Trusted Publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Garantir npm com suporte a OIDC
        run: npm install -g npm@latest # >= 11.5.1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build @blips/ui
        run: pnpm --filter @blips/ui build

      - name: Publicar no npm (Trusted Publishing / OIDC)
        run: npm publish --access public
        working-directory: packages/ui

      - name: Criar tag e release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PREV_TAG=$(git tag -l "v*" --sort=-version:refname | head -1)
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"
          if [ -n "$PREV_TAG" ]; then
            gh release create "${{ steps.ver.outputs.tag }}" \
              --title "${{ steps.ver.outputs.tag }}" \
              --generate-notes --notes-start-tag "$PREV_TAG"
          else
            gh release create "${{ steps.ver.outputs.tag }}" \
              --title "${{ steps.ver.outputs.tag }}" --generate-notes
          fi

      - name: Build docs (SSG export)
        run: pnpm --filter @blips/docs build

      - name: Deploy docs no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          entryPoint: apps/docs
          channelId: live
